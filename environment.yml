name: copc

channels:
  - conda-forge
  - nodefaults

dependencies:
  # Keep the compiled point-cloud and geospatial stack in one Conda solve.
  # The core package includes COPC support without unrelated optional plugins.
  - python=3.12
  - libpdal-core=2.10.*
  - python-pdal=3.5.*
  - pdal_wrench=1.5.*
  - gdal=3.13.*
  - rasterio=1.5.*
  - geopandas=1.1.3
  - shapely=2.1.2
  - pyarrow=24.0.0
  - numpy=2.4.6
  - pandas=3.0.3
  - pyvista=0.48.*
  - duckdb=1.5.3
  - rustac=0.9.11
  - dask=2026.3.0
  - distributed=2026.3.0
  - ipykernel=7.2.0
  - jupyterlab=4.5.7
  - pytest=8.*
