[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "copc-dataset"
version = "0.1.0"
description = "Metadata-first access to collections of COPC point clouds"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "dask[distributed]>=2025.1",
    "duckdb>=1.5",
    "pyarrow>=20",
    "pyproj>=3.6",
]

[project.optional-dependencies]
test = ["pytest>=8"]
visualization = ["pyvista>=0.48,<0.49"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
copc_dataset = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
